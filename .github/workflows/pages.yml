name: Publish skill lab V2
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public player data before publishing
        type: boolean
        default: true
      backfill:
        description: Resume historical leaderboard backfill
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skill-lab-v2-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Restore collected public data
        uses: actions/cache/restore@v4
        with:
          path: state
          key: public-xp-${{ github.run_id }}
          restore-keys: public-xp-
      - name: Restore durable leaderboard history
        run: bun run scripts/history-store.ts restore
      - name: Resume bounded historical backfill
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill)
        env:
          HISTORY_MINUTES: '12'
        run: bun run scripts/backfill-history.ts
      - name: Refresh player snapshots and resume historical scan
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: bun run refresh
      - name: Fill missing lifetime playtime
        run: bun run scripts/backfill-playtime.ts
      - run: bun run build
      - name: Save durable leaderboard history
        if: always()
        run: bun run scripts/history-store.ts save
      - name: Save collected public data
        uses: actions/cache/save@v4
        with:
          path: state
          key: public-xp-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
